[package]
name = "claude-gui"
version = "0.2.117"
description = "Claude GUI — native shell"
authors = ["wsxwj"]
license = "MIT"
edition = "2021"

[lib]
name = "claude_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-single-instance = "2"
# 官方对话框插件:文件夹选择走进程内 NSOpenPanel/IFileDialog(秒开、天然置前),
# 替代后端 osascript(mac 单 activate 就 2.1s)。前端主路径经它,失败自动回退
# 后端 picker(client/src/utils/pickDirectory.js),不劣化。
tauri-plugin-dialog = "2"
# 自动更新:updater 拉 GitHub release 的 latest.json 验签下载,process 提供更新后 relaunch。
# 前端 gate 在 SettingsPanel(仅 Tauri 且非本地 bot 版才走自动更新)。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 全局热键:注册系统级快捷键(默认 CmdOrCtrl+Shift+2)→ 置前主窗口 + emit 事件给前端触发截图。
# 只在 Rust 侧注册(setup 读 ~/.claude-gui/hotkey.json),不经 JS,故无需 capability/JS 插件包。
tauri-plugin-global-shortcut = "2"
# generate_context! 宏在 tauri.conf.json 含 plugins 配置时会展开出 serde_json::Value 字面量,
# 需要本 crate 直接依赖 serde_json(仅 tauri 传递依赖不够,宏在本 crate 内展开)。
serde_json = "1"
rfd = "0.15"
# 系统通知:窗口不在前台时,待处理的授权/表单请求与停下等待的后台代理发一条系统通知。
# 权限见 capabilities/notification.json(生产 remote 上下文须列全端口)。发送方全在前端
# (client/src/utils/desktopNotify.js),Rust 侧只挂插件。
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
# thin 替代 fat LTO:这个二进制只是壳(起 node + 系统 webview),运行时性能无关紧要;
# fat LTO 在 Windows CI(4 核 MSVC)链接要多花数分钟,thin 体积仅略增。
lto = "thin"
opt-level = "s"
strip = true
