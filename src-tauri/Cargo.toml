[package]
name = "claude-gui"
version = "0.2.67"
description = "Claude GUI — native shell"
authors = ["wsxwj"]
license = "MIT"
edition = "2021"

[lib]
name = "claude_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
