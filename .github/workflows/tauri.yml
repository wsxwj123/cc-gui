name: Build Desktop App

# Builds unsigned desktop installers for macOS and Windows. On a v* tag push, a
# SEPARATE release job gathers both platforms' artifacts and publishes ONE GitHub
# Release. Windows can't be built from a Mac locally, so this CI is the only path
# to a .exe — trigger it manually (Actions tab → Run workflow) or by pushing a v* tag.
#
# Why a separate release job: letting tauri-action create the release inside the
# build MATRIX races — both OS jobs create/delete the same-tag release and one
# clobbers the other (v0.1.2 was created then vanished this way). So the matrix
# only BUILDS + uploads artifacts; a single ubuntu job then creates the release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci
        working-directory: client

      # Build ONLY — no release inputs, so tauri-action just bundles per-OS
      # installers (dmg on macOS, nsis/msi on Windows; bundle.targets="all").
      # CGUI_PUBLIC_BUILD=1 satisfies require-public-build.cjs; a CI checkout has
      # no *.local.* files (gitignored) so the bundle is inherently clean.
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          CGUI_PUBLIC_BUILD: '1'

      # macOS dmg 里塞一个「双击去 quarantine」脚本,与 app 并列。用户拖 app 到
      # 应用程序后双击它即可解除 Gatekeeper 隔离,无需手敲 xattr 命令。
      - name: Inject quarantine-fix script into dmg
        if: runner.os == 'macOS'
        run: |
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "no dmg found, skipping"; exit 0; fi
          NAME='复制GUI后请双击此脚本去除quarantine.command'
          chmod +x scripts/dmg-fix-quarantine.command
          hdiutil convert "$DMG" -format UDRW -o /tmp/rw.dmg
          hdiutil resize -size 300m /tmp/rw.dmg || true
          DEV=$(hdiutil attach /tmp/rw.dmg -nobrowse -noverify | grep '/Volumes/')
          MOUNT=$(echo "$DEV" | sed -E 's|.*(/Volumes/.*)$|\1|')
          DISK=$(echo "$DEV" | awk '{print $1}')
          cp scripts/dmg-fix-quarantine.command "$MOUNT/$NAME"
          chmod +x "$MOUNT/$NAME"
          hdiutil detach "$DISK"
          rm -f "$DMG"
          hdiutil convert /tmp/rw.dmg -format UDZO -o "$DMG"
          rm -f /tmp/rw.dmg
          echo "injected quarantine-fix script into $DMG"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: claude-gui-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Single, race-free release: runs once after both builds, gathers every
  # installer, and publishes one GitHub Release for the pushed tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          未签名安装包,首次打开需手动放行。当前安装包会调用本机 Node.js 启动内置后端,运行机器需已安装 Node.js 20+ 和 Claude Code CLI。

          - **macOS**:仅支持 Apple Silicon(M 系列芯片)。打开 `.dmg` 后里面有两个东西:把 **Claude GUI** 拖进「应用程序」,然后**双击 dmg 里的「复制GUI后请双击此脚本去除quarantine.command」脚本**(无需 sudo),即可正常双击打开 app。原因:本 app 未做 Apple 付费公证(notarization),macOS 给下载的未公证 app 加了隔离属性,脚本只是移除这个标记。也可改用终端 `xattr -dr com.apple.quarantine '/Applications/Claude GUI.app'`,或右键 .app →「打开」。
          - **Windows**:`.exe`(NSIS)或 `.msi` 均可;SmartScreen 提示时点「更多信息 → 仍要运行」。
          - 若双击后无窗口,查看 `~/.claude-gui/tauri-startup.log` 获取启动错误。
          EOF
          # Installer filenames contain spaces ("Claude GUI_x.y.z_…"), so read them
          # into an array (null-delimited) and pass quoted — an unquoted $FILES
          # word-splits on the space and gh can't find the file.
          mapfile -d '' FILES < <(find dist-artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0)
          printf 'Attaching: %s\n' "${FILES[@]}"
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Claude GUI ${{ github.ref_name }}" \
            --notes-file notes.md \
            "${FILES[@]}"
