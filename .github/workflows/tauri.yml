name: Build Desktop App

# Builds unsigned desktop installers for macOS and Windows and uploads them as
# downloadable artifacts. Windows can't be built from a Mac locally, so this CI
# is the only path to a .exe — trigger it manually (Actions tab → Run workflow)
# or by pushing a v* tag.
#
# NOTE: this workflow has NOT been validated on a real Windows runner. The first
# run may surface platform-specific issues (node-pty rebuild, NSIS/WiX, bundled
# node_modules size) — read the failing step's log and adjust from there.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci
        working-directory: client

      # tauri-action runs the conf's beforeBuildCommand (npm run build:tauri) then
      # `tauri build`, bundling per-OS installers (dmg on macOS, nsis/msi on
      # Windows) because tauri.conf bundle.targets is "all".
      # CGUI_PUBLIC_BUILD=1 satisfies require-public-build.cjs (build:tauri refuses
      # without it). A CI checkout has no *.local.* files anyway (gitignored), so
      # the bundle is inherently clean — this just unblocks the guard.
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGUI_PUBLIC_BUILD: '1'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: claude-gui-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
