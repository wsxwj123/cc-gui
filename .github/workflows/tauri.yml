name: Build Desktop App

# Builds unsigned desktop installers for macOS and Windows. On a v* tag push, a
# SEPARATE release job gathers both platforms' artifacts and publishes ONE GitHub
# Release. Windows can't be built from a Mac locally, so this CI is the only path
# to a .exe — trigger it manually (Actions tab → Run workflow) or by pushing a v* tag.
#
# Why a separate release job: letting tauri-action create the release inside the
# build MATRIX races — both OS jobs create/delete the same-tag release and one
# clobbers the other (v0.1.2 was created then vanished this way). So the matrix
# only BUILDS + uploads artifacts; a single ubuntu job then creates the release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          # npm 缓存:Windows 文件系统上两次 npm ci 是分钟级开销,缓存 npm store 显著缩短
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci
        working-directory: client

      # Build ONLY — no release inputs, so tauri-action just bundles per-OS
      # installers (dmg on macOS, nsis/msi on Windows; bundle.targets="all").
      # CGUI_PUBLIC_BUILD=1 satisfies require-public-build.cjs; a CI checkout has
      # no *.local.* files (gitignored) so the bundle is inherently clean.
      # --config 叠加 tauri.updater.conf.json(createUpdaterArtifacts,产出 .app.tar.gz
      # 与 .sig 供自动更新;拆出主配置是因为本地 build 无签名私钥会失败)。tauri-action
      # 未设 projectPath 时 CWD=仓库根,--config 相对路径按仓库根写。签名私钥来自
      # repo secrets,TAURI_SIGNING_PRIVATE_KEY_PASSWORD 为空串(生成密钥时未设口令)。
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.updater.conf.json
        env:
          CGUI_PUBLIC_BUILD: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # macOS dmg 里塞一个「使用说明.txt」,与 app 并列。此前塞的是 .command 脚本,
      # 但未公证脚本在 macOS 15(Sequoia)连右键打开都不放行(用户实测报
      # "Apple 无法验证…是否包含恶意软件"),双击必被 Gatekeeper 拦。文本文件
      # 不受 Gatekeeper 限制,内容给出需在终端执行的 xattr 命令。
      - name: Inject quarantine instructions into dmg
        if: runner.os == 'macOS'
        run: |
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "no dmg found, skipping"; exit 0; fi
          NAME='使用说明:先拖入应用程序,再执行此文件中的命令.txt'
          cat > /tmp/quarantine-readme.txt <<'TXT'
          CC-GUI 安装步骤

          (你能读到这份说明,说明 dmg 已经挂载成功了。若之前双击 dmg 报「已损坏」,
           那是 dmg 本身的隔离标记,解法是先对 dmg 文件执行同样的 xattr 命令。)

          1. 把 CC-GUI 拖进「应用程序」文件夹。
          2. 打开「终端」(启动台搜索 Terminal),粘贴执行下面这行命令(无需 sudo):

          /usr/bin/xattr -dr com.apple.quarantine "/Applications/CC-GUI.app"

          3. 之后即可正常双击打开 CC-GUI。

          说明:本 app 未做 Apple 付费公证(notarization),macOS 会给下载的
          未公证 app 加隔离标记并阻止打开。上述命令仅移除该标记,不修改 app 本身。
          TXT
          hdiutil convert "$DMG" -format UDRW -o /tmp/rw.dmg
          hdiutil resize -size 300m /tmp/rw.dmg || true
          DEV=$(hdiutil attach /tmp/rw.dmg -nobrowse -noverify | grep '/Volumes/')
          MOUNT=$(echo "$DEV" | sed -E 's|.*(/Volumes/.*)$|\1|')
          DISK=$(echo "$DEV" | awk '{print $1}')
          cp /tmp/quarantine-readme.txt "$MOUNT/$NAME"
          hdiutil detach "$DISK"
          rm -f "$DMG"
          hdiutil convert /tmp/rw.dmg -format UDZO -o "$DMG"
          rm -f /tmp/rw.dmg
          echo "injected quarantine readme into $DMG"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: claude-gui-${{ matrix.os }}
          if-no-files-found: warn
          # 安装包本身已是压缩格式(dmg UDZO / NSIS lzma),artifact 再压是纯浪费,存储级直传更快
          compression-level: 0
          # updater 产物:mac 用 .app.tar.gz(+.sig),不受上面 dmg 重打包影响;
          # Windows NSIS 在 Tauri 2 直接对 setup.exe 出 .sig(无单独 zip 包)。
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/nsis/*.exe.sig

  # Single, race-free release: runs once after both builds, gathers every
  # installer, and publishes one GitHub Release for the pushed tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          未签名安装包,首次打开需手动放行。当前安装包会调用本机 Node.js 启动内置后端,运行机器需已安装 Node.js 20+ 和 Claude Code CLI。

          - **macOS**:仅支持 Apple Silicon(M 系列芯片)。打开 `.dmg`,把 **CC-GUI** 拖进「应用程序」,然后在「终端」执行下面这行命令,之后即可正常双击打开 app:

            ```
            /usr/bin/xattr -dr com.apple.quarantine "/Applications/CC-GUI.app"
            ```

            原因:本 app 未做 Apple 付费公证(notarization),macOS 给下载的未公证 app 加隔离标记并阻止打开;该命令仅移除此标记,不修改 app 本身,不需要 sudo。

            少数情况下 `.dmg` 双击也会报「已损坏」(通过非浏览器渠道传输时更容易出现),同样处理即可:`/usr/bin/xattr -dr com.apple.quarantine 你的.dmg 路径`。macOS 15 起未公证脚本连右键打开都不放行,故不提供双击脚本。
          - **Windows**:`.exe`(NSIS)或 `.msi` 均可;SmartScreen 提示时点「更多信息 → 仍要运行」。
          - 若双击后无窗口,查看 `~/.claude-gui/tauri-startup.log` 获取启动错误。
          EOF
          # Installer filenames (CC-GUI_x.y.z_…) may contain spaces, so read them
          # into an array (null-delimited) and pass quoted — an unquoted $FILES
          # word-splits on the space and gh can't find the file.
          # *.app.tar.gz / *.sig 是 updater 产物,随常规资产一起上传(latest.json 在下一步拼)。
          mapfile -d '' FILES < <(find dist-artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0)
          printf 'Attaching: %s\n' "${FILES[@]}"
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "CC-GUI ${{ github.ref_name }}" \
            --notes-file notes.md \
            "${FILES[@]}"

      # 拼 latest.json(Tauri updater 清单)并追传到 release。
      #  - 资产 URL 必须用 gh release view 拿 GitHub 改写后的真实值(文件名含空格会被
      #    改写成 "Claude.GUI_…",手拼必错)。
      #  - signature 是 .sig 文件的【内容】(minisign base64),不是文件 URL。
      #  - 平台键只有 darwin-aarch64 + windows-x86_64:CI 是 arm64 mac runner,从无
      #    Intel 包;Windows 用 NSIS setup.exe 的 URL+sig。
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DARWIN_SIG_FILE=$(find dist-artifacts -type f -name '*.app.tar.gz.sig' | head -1)
          WIN_SIG_FILE=$(find dist-artifacts -type f -name '*-setup.exe.sig' | head -1)
          [ -n "$DARWIN_SIG_FILE" ] || { echo "FATAL: no .app.tar.gz.sig artifact (mac updater 签名缺失)"; exit 1; }
          [ -n "$WIN_SIG_FILE" ] || { echo "FATAL: no -setup.exe.sig artifact (win updater 签名缺失)"; exit 1; }
          # 断言签名非空且像 base64(空/乱码 = 私钥没生效,发出去的 latest.json 会让所有客户端校验失败)
          for f in "$DARWIN_SIG_FILE" "$WIN_SIG_FILE"; do
            if ! tr -d '\r\n' < "$f" | grep -qE '^[A-Za-z0-9+/=]{80,}$'; then
              echo "FATAL: signature not base64-like: $f"; cat "$f"; exit 1
            fi
          done
          DARWIN_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '[.assets[] | select(.name | endswith(".app.tar.gz"))][0].url')
          WIN_URL=$(gh release view "$TAG" --repo "$REPO" --json assets \
            -q '[.assets[] | select(.name | endswith("-setup.exe"))][0].url')
          [ -n "$DARWIN_URL" ] && [ "$DARWIN_URL" != "null" ] || { echo "FATAL: darwin asset url not found"; exit 1; }
          [ -n "$WIN_URL" ] && [ "$WIN_URL" != "null" ] || { echo "FATAL: windows asset url not found"; exit 1; }
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%FT%TZ)" \
            --arg durl "$DARWIN_URL" \
            --arg wurl "$WIN_URL" \
            --rawfile dsig "$DARWIN_SIG_FILE" \
            --rawfile wsig "$WIN_SIG_FILE" \
            '{version: $version, pub_date: $pub_date, platforms: {
               "darwin-aarch64": { signature: ($dsig | gsub("[\r\n]"; "")), url: $durl },
               "windows-x86_64": { signature: ($wsig | gsub("[\r\n]"; "")), url: $wurl }
             }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
